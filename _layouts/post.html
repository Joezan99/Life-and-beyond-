
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | Life & Beyond</title>

  <meta name="description" content="{{ page.excerpt | strip_html | escape }}">

  <meta name="theme-color" content="#172C27">

  <style>
    :root {
      --green: #172C27;
      --gold: #D6B88C;
      --cream: #F5F2EA;
      --dark: #292D32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--dark);
      font-family: Arial, sans-serif;
      line-height: 1.8;
    }

    header {
      background: var(--green);
      padding: 22px 6%;
    }

    header a {
      color: var(--gold);
      text-decoration: none;
      font-family: Georgia, serif;
      font-size: 26px;
      font-weight: bold;
    }

    .article {
      max-width: 780px;
      margin: 50px auto;
      padding: 0 22px;
    }

    .category {
      color: #80633f;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      color: var(--green);
      font-family: Georgia, serif;
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1.2;
      margin: 15px 0;
    }

    .date {
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      font-size: 17px;
    }

    .content h2,
    .content h3 {
      color: var(--green);
      font-family: Georgia, serif;
      line-height: 1.3;
      margin-top: 30px;
    }

    .content img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .content a {
      color: #80633f;
    }

    .back {
      display: inline-block;
      margin: 30px 0;
      color: var(--green);
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      background: var(--green);
      color: white;
      text-align: center;
      padding: 25px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .article {
        margin: 30px auto;
      }

      .content {
        padding: 20px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="{{ '/' | relative_url }}">Life & Beyond</a>
  </header>

  <main class="article">

    <div class="category">
      {{ page.categories | first }}
    </div>

    <h1>{{ page.title }}</h1>

    <div class="date">
      Published:
      {{ page.date | date: "%B %d, %Y" }}
    </div>

    <article class="content">
      {{ content }}
    </article>

    <a class="back" href="{{ '/' | relative_url }}">
      ← Back to Life & Beyond
    </a>

  </main>

  <footer>
    Life & Beyond — Understand Life. Grow with Purpose.
  </footer>

</body>
</html>
